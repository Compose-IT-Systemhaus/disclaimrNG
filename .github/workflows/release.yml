name: Release

# The image for the same tag is built and pushed by ci.yml (docker job).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" pyproject.toml \
            || { echo "::error::pyproject.toml version does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac  # v0.2.0-rc1
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
