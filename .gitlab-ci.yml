# GitLab CI: build the Docker image and publish it to the GitHub Container
# Registry (ghcr.io) when a release tag is pushed — same image and tags as the
# GitHub Actions `docker` job (.github/workflows/ci.yml).
#
#   git tag v0.2.0 && git push origin v0.2.0
#     -> ghcr.io/compose-it-systemhaus/disclaimrng:0.2.0, :0.2 and :latest
#   git tag v0.2.0-rc1 && git push origin v0.2.0-rc1
#     -> ghcr.io/compose-it-systemhaus/disclaimrng:0.2.0-rc1 only
#
# One-time setup (Settings > CI/CD > Variables, both "Masked"):
#   GHCR_USER   GitHub user the token belongs to
#   GHCR_TOKEN  GitHub personal access token (classic) with `write:packages`;
#               the user needs write access to the disclaimrng package
# If the variables are "Protected", protect the tag pattern `v*` as well
# (Settings > Repository > Protected tags), or the job will not see them.
#
# Needs a runner that can run Docker-in-Docker (privileged mode).

stages: [release]

variables:
  IMAGE: ghcr.io/compose-it-systemhaus/disclaimrng
  SOURCE_URL: https://github.com/Compose-IT-Systemhaus/disclaimrNG
  DOCKER_TLS_CERTDIR: "/certs"

publish-image:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  rules:
    # v1.2.3 and pre-releases like v1.2.3-rc1; nothing else.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  script:
    - |
      set -eu
      version="${CI_COMMIT_TAG#v}"

      # Guard against a mistyped tag: pyproject.toml must carry the same number
      # (PEP 440 spells a pre-release "0.2.0rc1", the tag "0.2.0-rc1", so only
      # the part before the "-" is compared).
      grep -q "^version = \"${version%%-*}" pyproject.toml \
        || { echo "pyproject.toml version does not match tag $CI_COMMIT_TAG"; exit 1; }

      # Pre-releases (1.2.3-rc1) only get their exact tag.
      tags="-t $IMAGE:$version"
      case "$version" in
        *-*) ;;
        *) tags="$tags -t $IMAGE:${version%.*} -t $IMAGE:latest" ;;
      esac

      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      docker build --pull $tags \
        --label "org.opencontainers.image.source=$SOURCE_URL" \
        --label "org.opencontainers.image.version=$version" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        .
      docker push --all-tags "$IMAGE"
