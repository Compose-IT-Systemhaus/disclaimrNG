# Dev overrides: live source mount + Django runserver + exposed Postgres port.
# Usage: docker compose -f compose.yml -f compose.dev.yml up

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build:
      target: runtime
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - .:/app
    # Same first-boot steps as the web role (migrations, admin user), plus the
    # translations (the source mount hides the ones compiled into the image).
    # The healthcheck only passes once runserver is up, so the milter waits for
    # the migrations.
    command:
      - bash
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py compilemessages -v0 &&
        python manage.py bootstrap_admin &&
        exec python manage.py runserver 0.0.0.0:8000

  milter:
    volumes:
      - .:/app
