# Overlay for running disclaimrNG on the same Docker host as a Stalwart container.
#
#   docker compose -f compose.yml -f compose.stalwart.yml up -d
#
# It puts the milter into the external Docker network ``mailnet`` as
# ``disclaimrng-milter``, so the Stalwart container (which joins the same network)
# reaches it at disclaimrng-milter:5000.
#
# Prepare once:   docker network create mailnet
# Another network name: set STALWART_NETWORK in .env.
#
# The Active Directory CA for ldaps:// needs no overlay: put it at ./certs/ad-ca.pem
# (compose.yml mounts ./certs, the entrypoint picks the file up).
#
# Step-by-step: docs/en/stalwart-active-directory.md (also in the admin under Documentation).

services:
  milter:
    networks:
      default:
      mailnet:
        aliases:
          - disclaimrng-milter

networks:
  mailnet:
    external: true
    name: ${STALWART_NETWORK:-mailnet}
