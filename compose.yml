name: disclaimrng

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-disclaimr}
      POSTGRES_USER: ${POSTGRES_USER:-disclaimr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Built from this checkout by default. To run a published release instead,
    # set DISCLAIMR_IMAGE=ghcr.io/compose-it-systemhaus/disclaimrng:0.1.1 and
    # DISCLAIMR_PULL_POLICY=missing in .env (see .env.example).
    image: ${DISCLAIMR_IMAGE:-ghcr.io/compose-it-systemhaus/disclaimrng:dev}
    pull_policy: ${DISCLAIMR_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    # Plain HTTP with the admin login: on a shared network put it behind a TLS
    # proxy (compose.traefik.yml) or bind it to a private address via WEB_BIND.
    ports:
      - "${WEB_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      # Private CA for ldaps:// (optional): put the PEM file at ./certs/ad-ca.pem; the
      # entrypoint then sets LDAPTLS_CACERT. Without it nothing changes.
      - ./certs:/etc/ssl/ad:ro
      # Uploaded signature images live here (served at /media/ by the web
      # container; the milter only builds their URLs and never reads the files).
      # Override the bind path with MEDIA_HOST_PATH if you'd rather use a host
      # directory (handy for backups/rsync from the host).
      - ${MEDIA_HOST_PATH:-media}:/app/media
    command: ["web"]
    healthcheck:
      # /healthz checks the database; start_period covers migrate + collectstatic.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  milter:
    # Same image as web — the build is cached so this doesn't double the
    # build time.
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DISCLAIMR_IMAGE:-ghcr.io/compose-it-systemhaus/disclaimrng:dev}
    pull_policy: ${DISCLAIMR_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file: .env
    ports:
      - "${MILTER_BIND:-127.0.0.1}:5000:5000"
    volumes:
      # Private CA for ldaps:// (optional): put the PEM file at ./certs/ad-ca.pem; the
      # entrypoint then sets LDAPTLS_CACERT. Without it nothing changes.
      - ./certs:/etc/ssl/ad:ro
    command: ["milter"]
    healthcheck:
      # Opening the milter port is enough; the forked child exits when we hang up.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  staticfiles:
  media:
